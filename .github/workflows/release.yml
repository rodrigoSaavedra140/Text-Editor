name: Release & Multiplatform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: karkinos
            artifact_name: karkinos-linux-x86_64.tar.gz
            raw_name: karkinos-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: karkinos.exe
            artifact_name: karkinos-windows-x86_64.zip
            raw_name: karkinos-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.artifact_name }}

      # La auto-actualización descarga el binario suelto, así no necesita tar ni
      # zip: lo publicamos además del paquete de siempre, con el nombre que
      # espera la app (ver platform_asset_name en karkinos-core).
      - name: Stage raw Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.raw_name }}
          chmod 0755 ${{ matrix.raw_name }}

      - name: Stage raw Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -Destination ${{ matrix.raw_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.raw_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job final: las sumas se calculan recién cuando los 4 assets ya están
  # publicados por los dos jobs de la matriz. Lo corre un solo runner porque
  # SHA256SUMS es un único archivo con las 4 líneas.
  checksums:
    name: Publish SHA256SUMS
    needs: build
    # Solo tiene sentido cuando el workflow publicó un release para el tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir assets \
            --pattern 'karkinos-linux-x86_64' \
            --pattern 'karkinos-linux-x86_64.tar.gz' \
            --pattern 'karkinos-windows-x86_64.exe' \
            --pattern 'karkinos-windows-x86_64.zip'

      # Formato sha256sum: "<hash hex en minúsculas>  <nombre>", una línea por
      # archivo. La app compara el SHA-256 del binario descargado contra su
      # línea en este archivo antes de reemplazar el ejecutable.
      - name: Generate SHA256SUMS
        run: |
          cd assets
          sha256sum \
            karkinos-linux-x86_64 \
            karkinos-linux-x86_64.tar.gz \
            karkinos-windows-x86_64.exe \
            karkinos-windows-x86_64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  # Publicación del paquete AUR `karkinos-bin` (spec S4): así `yay -Syu` /
  # `paru -Syu` actualizan Karkinos junto con el resto del sistema.
  #
  # `secrets` no se puede usar en el `if` de un job, así que este job chico
  # traduce la presencia de `AUR_SSH_PRIVATE_KEY` a un output y el job `aur`
  # compara ese valor. Sin el secret, `aur` queda SKIPPED (no falla) y el
  # release se publica igual: la primera publicación necesita el secret a mano.
  aur-gate:
    name: Check AUR credentials
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      # El secret se pasa por `env`, nunca interpolado en el script, para que
      # no pueda aparecer en el log.
      - name: Detect AUR_SSH_PRIVATE_KEY
        id: check
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_PRIVATE_KEY is not set: skipping the AUR publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  aur:
    name: Publish karkinos-bin to the AUR
    needs: [checksums, aur-gate]
    if: needs.aur-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # `makepkg` (el generador de .SRCINFO) solo existe en Arch: el job corre
    # dentro de un contenedor Arch en vez de reimplementar el formato a mano.
    container: archlinux:latest
    env:
      PKGNAME: karkinos-bin
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed git openssh curl

      - name: Checkout repository
        uses: actions/checkout@v4

      # Los mismos 4 archivos que declara `source` en el PKGBUILD, para que
      # los sha256sums que se publican sean los de esos archivos exactos.
      - name: Download release files
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          mkdir -p assets
          curl -fsSL -o assets/karkinos-linux-x86_64.tar.gz \
            "https://github.com/${repo}/releases/download/${tag}/karkinos-linux-x86_64.tar.gz"
          curl -fsSL -o assets/karkinos.desktop \
            "https://raw.githubusercontent.com/${repo}/${tag}/assets/karkinos.desktop"
          curl -fsSL -o assets/karkinos.png \
            "https://raw.githubusercontent.com/${repo}/${tag}/assets/karkinos.png"
          curl -fsSL -o assets/LICENSE \
            "https://raw.githubusercontent.com/${repo}/${tag}/LICENSE"
          ls -l assets

      # La plantilla del repositorio lleva `pkgver` de referencia y
      # `sha256sums=('SKIP' ...)`; acá se reemplazan por el tag y los hashes
      # reales de los archivos descargados, en el orden de `source`.
      - name: Fill pkgver and sha256sums into the PKGBUILD
        run: |
          set -euo pipefail
          pkgver="${GITHUB_REF_NAME#v}"
          pkgbuild="packaging/aur/${PKGNAME}/PKGBUILD"
          mapfile -t sums < <(
            cd assets
            sha256sum karkinos-linux-x86_64.tar.gz karkinos.desktop karkinos.png LICENSE | awk '{ print $1 }'
          )
          if [ "${#sums[@]}" -ne 4 ]; then
            echo "expected 4 checksums, got ${#sums[@]}" >&2
            exit 1
          fi
          sed -i \
            -e "s|^pkgver=.*|pkgver=${pkgver}|" \
            -e "s|^pkgrel=.*|pkgrel=1|" \
            -e "s|^sha256sums=.*|sha256sums=('${sums[0]}' '${sums[1]}' '${sums[2]}' '${sums[3]}')|" \
            "$pkgbuild"
          grep -E '^(pkgver|pkgrel|sha256sums)=' "$pkgbuild"

      # makepkg se niega a correr como root: el .SRCINFO se genera como un
      # usuario sin privilegios del contenedor.
      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          pkgdir="$(pwd)/packaging/aur/${PKGNAME}"
          id -u builder >/dev/null 2>&1 || useradd --create-home builder
          chown -R builder "$pkgdir"
          runuser -u builder -- bash -c "cd '$pkgdir' && makepkg --printsrcinfo" > "$pkgdir/.SRCINFO"
          cat "$pkgdir/.SRCINFO"

      # La clave SSH vive solo en el runner efímero: se escribe con umask 077,
      # nunca entra al repositorio ni al log, y se borra al terminar el paso.
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pkgver="${GITHUB_REF_NAME#v}"
          workdir="$(mktemp -d)"
          install -d -m 700 "$HOME/.ssh"
          ( umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur" )
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts" 2>/dev/null
          trap 'rm -rf "$workdir"; rm -f "$HOME/.ssh/aur"' EXIT
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          # Primera publicación: si el paquete todavía no existe en la AUR el
          # clone falla, así que se arranca un repo vacío y el push lo crea.
          if ! git clone --quiet "ssh://aur@aur.archlinux.org/${PKGNAME}.git" "$workdir/aur"; then
            echo "AUR repo ${PKGNAME} does not exist yet: creating it with the first push" >&2
            git init --quiet "$workdir/aur"
            git -C "$workdir/aur" symbolic-ref HEAD refs/heads/master
            git -C "$workdir/aur" remote add origin "ssh://aur@aur.archlinux.org/${PKGNAME}.git"
          fi
          cp "packaging/aur/${PKGNAME}/PKGBUILD" "packaging/aur/${PKGNAME}/.SRCINFO" "$workdir/aur/"
          cd "$workdir/aur"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date for v${pkgver}"
          else
            git commit --quiet -m "Update to ${pkgver}"
            git push --quiet origin HEAD:master
            echo "Published ${PKGNAME} ${pkgver} to the AUR"
          fi
