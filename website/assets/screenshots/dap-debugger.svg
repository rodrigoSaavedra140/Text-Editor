<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #21262d; }
      .tab-active { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .txt-main { font-family: monospace; font-size: 13px; fill: #e6edf3; }
      .txt-muted { font-family: monospace; font-size: 12px; fill: #8b949e; }
      .txt-kw { font-family: monospace; font-size: 13px; fill: #ff7b72; font-weight: bold; }
      .txt-fn { font-family: monospace; font-size: 13px; fill: #d2a8ff; }
      .txt-type { font-family: monospace; font-size: 13px; fill: #79c0ff; }
      .txt-num { font-family: monospace; font-size: 13px; fill: #79c0ff; }
      .dock { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .dock-bar { fill: #21262d; }
      .active-line-bg { fill: rgba(255, 215, 0, 0.15); }
    </style>
  </defs>

  <rect width="800" height="480" rx="8" class="bg" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect width="800" height="38" rx="8" class="bar"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="75" y="23" font-family="sans-serif" font-size="12" fill="#8b949e" font-weight="600">Karkinos IDE — Native DAP Debugger (F5 / F9 / F10)</text>

  <!-- Debugger status indicator badge -->
  <rect x="620" y="7" width="165" height="24" rx="4" fill="#302613" stroke="#e3b341"/>
  <text x="635" y="23" font-family="sans-serif" font-size="11" fill="#f2cc60" font-weight="bold">⏸ Stopped: Breakpoint</text>

  <!-- Tab bar -->
  <rect x="0" y="38" width="800" height="28" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <rect x="10" y="42" width="120" height="24" rx="3" class="tab-active"/>
  <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#e6edf3">worker.rs</text>

  <!-- Active stopped line highlight in editor -->
  <rect x="50" y="112" width="750" height="22" class="active-line-bg"/>

  <!-- Gutter with Breakpoint and Yellow Execution Pointer -->
  <rect x="0" y="66" width="50" height="194" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="32" y="100" class="txt-muted">1</text>

  <!-- Line 2: Breakpoint & Stopped pointer -->
  <circle cx="15" cy="123" r="5" fill="#f85149"/>
  <polygon points="12,118 20,123 12,128" fill="#f2cc60"/>
  <text x="32" y="128" class="txt-muted" fill="#f2cc60" font-weight="bold">2</text>

  <text x="32" y="152" class="txt-muted">3</text>
  <text x="32" y="176" class="txt-muted">4</text>
  <text x="32" y="200" class="txt-muted">5</text>
  <text x="32" y="224" class="txt-muted">6</text>

  <!-- Code content -->
  <text x="65" y="100" class="txt-kw">pub fn</text>
  <text x="120" y="100" class="txt-fn">process_job</text>
  <text x="205" y="100" class="txt-main">(job_id: </text>
  <text x="270" y="100" class="txt-type">u64</text>
  <text x="295" y="100" class="txt-main">) -&gt; </text>
  <text x="330" y="100" class="txt-type">Result&lt;usize, String&gt;</text>
  <text x="495" y="100" class="txt-main"> {</text>

  <text x="85" y="128" class="txt-kw">let</text>
  <text x="115" y="128" class="txt-main">payload = fetch_payload(job_id)?;</text>

  <text x="85" y="152" class="txt-kw">let</text>
  <text x="115" y="152" class="txt-main">mut total = </text>
  <text x="200" y="152" class="txt-num">0</text>
  <text x="210" y="152" class="txt-main">;</text>

  <text x="85" y="176" class="txt-kw">for</text>
  <text x="115" y="176" class="txt-main">byte </text>
  <text x="155" y="176" class="txt-kw">in</text>
  <text x="175" y="176" class="txt-main">&amp;payload { total += *byte </text>
  <text x="365" y="176" class="txt-kw">as</text>
  <text x="385" y="176" class="txt-type">usize</text>
  <text x="425" y="176" class="txt-main">; }</text>

  <text x="85" y="200" class="txt-type">Ok</text>
  <text x="100" y="200" class="txt-main">(total)</text>

  <text x="65" y="224" class="txt-main">}</text>

  <!-- Bottom DAP Debugger Dock -->
  <rect x="0" y="260" width="800" height="220" class="dock"/>
  <rect x="0" y="260" width="800" height="32" class="dock-bar"/>

  <!-- Step Controls -->
  <g transform="translate(10, 265)">
    <rect width="100" height="22" rx="3" fill="#238636"/>
    <text x="10" y="15" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">▶ Continue (F5)</text>

    <rect x="108" y="0" width="100" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="116" y="15" font-family="sans-serif" font-size="11" fill="#e6edf3">↷ Step Over (F10)</text>

    <rect x="216" y="0" width="90" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="224" y="15" font-family="sans-serif" font-size="11" fill="#e6edf3">⇲ Step In (F11)</text>

    <rect x="314" y="0" width="100" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="322" y="15" font-family="sans-serif" font-size="11" fill="#e6edf3">⇱ Step Out (⇧F11)</text>

    <rect x="422" y="0" width="90" height="22" rx="3" fill="#da3633"/>
    <text x="430" y="15" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">⏹ Stop (⇧F5)</text>
  </g>

  <!-- 3 Columns Inspector: Call Stack | Variables | Breakpoints -->
  <g transform="translate(15, 305)">
    <!-- Col 1: Call Stack -->
    <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#58a6ff" font-weight="bold">Call Stack:</text>
    <rect x="0" y="25" width="240" height="135" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="10" y="45" font-family="monospace" font-size="11" fill="#f2cc60">▶ process_job:2 (worker.rs)</text>
    <text x="10" y="65" font-family="monospace" font-size="11" fill="#8b949e">  dispatch_task:48 (server.rs)</text>
    <text x="10" y="85" font-family="monospace" font-size="11" fill="#8b949e">  tokio::runtime:112</text>

    <!-- Col 2: Variables -->
    <g transform="translate(260, 0)">
      <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#58a6ff" font-weight="bold">Variables:</text>
      <rect x="0" y="25" width="240" height="135" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="10" y="45" font-family="monospace" font-size="11" fill="#ff7b72">job_id</text>
      <text x="60" y="45" font-family="monospace" font-size="11" fill="#8b949e">: u64</text>
      <text x="105" y="45" font-family="monospace" font-size="11" fill="#79c0ff">= 1042</text>

      <text x="10" y="68" font-family="monospace" font-size="11" fill="#ff7b72">payload</text>
      <text x="70" y="68" font-family="monospace" font-size="11" fill="#8b949e">: Vec&lt;u8&gt;</text>
      <text x="140" y="68" font-family="monospace" font-size="11" fill="#e6edf3">= [len: 64]</text>

      <text x="10" y="91" font-family="monospace" font-size="11" fill="#ff7b72">total</text>
      <text x="50" y="91" font-family="monospace" font-size="11" fill="#8b949e">: usize</text>
      <text x="105" y="91" font-family="monospace" font-size="11" fill="#79c0ff">= 0</text>
    </g>

    <!-- Col 3: Breakpoints -->
    <g transform="translate(520, 0)">
      <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#58a6ff" font-weight="bold">Breakpoints:</text>
      <rect x="0" y="25" width="245" height="135" rx="4" fill="#0d1117" stroke="#30363d"/>
      <circle cx="15" cy="45" r="4" fill="#f85149"/>
      <text x="25" y="48" font-family="monospace" font-size="11" fill="#e6edf3">worker.rs:2</text>
      <text x="215" y="48" font-family="sans-serif" font-size="11" fill="#8b949e">×</text>

      <circle cx="15" cy="70" r="4" fill="#f85149"/>
      <text x="25" y="73" font-family="monospace" font-size="11" fill="#e6edf3">server.rs:52</text>
      <text x="215" y="73" font-family="sans-serif" font-size="11" fill="#8b949e">×</text>
    </g>
  </g>
</svg>
