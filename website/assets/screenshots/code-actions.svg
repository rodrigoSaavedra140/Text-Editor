<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #21262d; }
      .tab-active { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .txt-main { font-family: monospace; font-size: 13px; fill: #e6edf3; }
      .txt-muted { font-family: monospace; font-size: 12px; fill: #8b949e; }
      .txt-kw { font-family: monospace; font-size: 13px; fill: #ff7b72; font-weight: bold; }
      .txt-fn { font-family: monospace; font-size: 13px; fill: #d2a8ff; }
      .txt-type { font-family: monospace; font-size: 13px; fill: #79c0ff; }
      .txt-err { font-family: monospace; font-size: 13px; fill: #f85149; text-decoration: underline wavy #f85149; }
      .popup-bg { fill: #1c2128; stroke: #444c56; stroke-width: 1.5; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
      .action-item { fill: #2d333b; rx: 4; }
      .action-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #e6edf3; font-weight: 500; }
      .badge { fill: #388bfd33; stroke: #388bfd; stroke-width: 1; rx: 3; }
      .badge-txt { font-family: sans-serif; font-size: 10px; fill: #58a6ff; font-weight: bold; }
    </style>
  </defs>

  <rect width="800" height="480" rx="8" class="bg" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect width="800" height="38" rx="8" class="bar"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="75" y="23" font-family="sans-serif" font-size="12" fill="#8b949e" font-weight="600">Karkinos IDE — Quick-Fixes &amp; Auto-Imports (Ctrl+.)</text>

  <!-- Tab bar -->
  <rect x="0" y="38" width="800" height="28" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <rect x="10" y="42" width="120" height="24" rx="3" class="tab-active"/>
  <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#e6edf3">server.rs</text>

  <!-- Gutter -->
  <rect x="0" y="66" width="50" height="414" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="32" y="100" class="txt-muted">1</text>
  <text x="32" y="125" class="txt-muted">2</text>
  <text x="32" y="150" class="txt-muted">3</text>
  <text x="32" y="175" class="txt-muted">4</text>
  <text x="32" y="200" class="txt-muted">5</text>
  <text x="32" y="225" class="txt-muted">6</text>
  <text x="32" y="250" class="txt-muted">7</text>
  <circle cx="15" cy="171" r="4" fill="#f85149"/>

  <!-- Code with missing import error -->
  <text x="65" y="100" class="txt-kw">pub async fn</text>
  <text x="175" y="100" class="txt-fn">handle_request</text>
  <text x="285" y="100" class="txt-main">() -&gt; Result&lt;(), </text>
  <text x="405" y="100" class="txt-type">Error</text>
  <text x="445" y="100" class="txt-main">&gt; {</text>

  <text x="85" y="130" class="txt-kw">let</text>
  <text x="115" y="130" class="txt-main">router = Router::new();</text>

  <text x="85" y="175" class="txt-kw">let</text>
  <text x="115" y="175" class="txt-main">mut state: </text>
  <text x="200" y="175" class="txt-err">HashMap</text>
  <text x="260" y="175" class="txt-main">&lt;String, u64&gt; = HashMap::new();</text>

  <text x="85" y="225" class="txt-type">Ok</text>
  <text x="100" y="225" class="txt-main">(())</text>

  <text x="65" y="255" class="txt-main">}</text>

  <!-- Floating Quick-Fix / Code Action Menu (Ctrl+.) -->
  <g transform="translate(190, 190)">
    <rect width="440" height="195" rx="6" class="popup-bg"/>
    <!-- Header -->
    <rect width="440" height="28" rx="6" fill="#21262d"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" fill="#e6edf3" font-weight="bold">💡 Quick Fix / Code Actions (Esc to close)</text>

    <!-- Item 1: Auto import (Preferred) -->
    <g transform="translate(8, 36)">
      <rect width="424" height="34" class="action-item" fill="#1f3b5c" stroke="#388bfd" stroke-width="1"/>
      <rect x="8" y="8" width="60" height="18" class="badge"/>
      <text x="14" y="21" class="badge-txt">★ PREFERRED</text>
      <text x="80" y="22" class="action-txt">Import `std::collections::HashMap`</text>
      <text x="365" y="21" font-family="monospace" font-size="11" fill="#8b949e">Enter ↵</text>
    </g>

    <!-- Item 2: Qualify path -->
    <g transform="translate(8, 76)">
      <rect width="424" height="30" class="action-item"/>
      <text x="12" y="20" class="action-txt">Qualify as `std::collections::HashMap`</text>
    </g>

    <!-- Item 3: Derive trait -->
    <g transform="translate(8, 112)">
      <rect width="424" height="30" class="action-item"/>
      <text x="12" y="20" class="action-txt">Fill missing match arms / assists</text>
    </g>

    <!-- Item 4: Extract function -->
    <g transform="translate(8, 148)">
      <rect width="424" height="30" class="action-item"/>
      <text x="12" y="20" class="action-txt">Extract selection into new helper function</text>
    </g>
  </g>
</svg>
