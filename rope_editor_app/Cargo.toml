[package]
name = "rope_editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "rope_editor"
path = "src/lib.rs"

[[bin]]
name = "rope_editor"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"

# Binario más liviano y rápido sin cambiar el código: LTO entre crates,
# una sola unidad de codegen y símbolos de debug fuera.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
