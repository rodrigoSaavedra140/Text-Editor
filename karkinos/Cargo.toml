[package]
name = "karkinos"
version = "0.2.4"
edition = "2021"

[[bin]]
name = "karkinos"
path = "src/main.rs"

[dependencies]
karkinos-core = { path = "../crates/karkinos-core" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
image = { version = "0.24", default-features = false, features = ["png"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }
ropey = "1.6"