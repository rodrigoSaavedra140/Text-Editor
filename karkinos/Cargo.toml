[package]
name = "karkinos"
version = "0.2.27"
edition = "2021"

[[bin]]
name = "karkinos"
path = "src/main.rs"

[dependencies]
karkinos-core = { path = "../crates/karkinos-core" }
image = { version = "0.24", default-features = false, features = ["png"] }
ropey = "1.6"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
arboard = { version = "3.6" }
