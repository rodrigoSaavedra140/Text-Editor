<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #21262d; }
      .tab-active { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .txt-main { font-family: monospace; font-size: 13px; fill: #e6edf3; }
      .txt-muted { font-family: monospace; font-size: 12px; fill: #8b949e; }
      .txt-kw { font-family: monospace; font-size: 13px; fill: #ff7b72; font-weight: bold; }
      .txt-fn { font-family: monospace; font-size: 13px; fill: #d2a8ff; }
      .txt-type { font-family: monospace; font-size: 13px; fill: #79c0ff; }
      .txt-str { font-family: monospace; font-size: 13px; fill: #a5d6ff; }
      .txt-num { font-family: monospace; font-size: 13px; fill: #79c0ff; }
      .btn { fill: #238636; rx: 4; }
      .btn-txt { font-family: sans-serif; font-size: 12px; fill: #ffffff; font-weight: bold; }
      .err-badge { fill: #f85149; rx: 3; }
      .warn-badge { fill: #d29922; rx: 3; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="480" rx="8" class="bg" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect width="800" height="38" rx="8" class="bar"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="75" y="23" font-family="sans-serif" font-size="12" fill="#8b949e" font-weight="600">Karkinos IDE — src/main.rs (v0.2.3)</text>

  <!-- Rust Action Toolbar (Right-Up) -->
  <g transform="translate(420, 7)">
    <rect width="365" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="10" y="16" font-family="sans-serif" font-size="11" fill="#de6432" font-weight="bold">🦀 Rust:</text>
    <rect x="65" y="3" width="50" height="18" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="75" y="15" font-family="sans-serif" font-size="10" fill="#e6edf3">Check</text>
    <rect x="120" y="3" width="50" height="18" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="130" y="15" font-family="sans-serif" font-size="10" fill="#e6edf3">Clippy</text>
    <rect x="175" y="3" width="45" height="18" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="185" y="15" font-family="sans-serif" font-size="10" fill="#e6edf3">Test</text>
    <rect x="225" y="3" width="50" height="18" rx="3" fill="#238636"/>
    <text x="233" y="15" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">▶ Run</text>
    <rect x="280" y="3" width="75" height="18" rx="3" fill="#30363d"/>
    <text x="288" y="15" font-family="sans-serif" font-size="10" fill="#58a6ff">Console ▾</text>
  </g>

  <!-- Tab bar -->
  <rect x="0" y="38" width="800" height="28" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <rect x="10" y="42" width="120" height="24" rx="3" class="tab-active"/>
  <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#e6edf3">main.rs</text>
  <text x="110" y="58" font-family="sans-serif" font-size="11" fill="#8b949e">×</text>

  <!-- Gutter & Line numbers -->
  <rect x="0" y="66" width="50" height="234" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="32" y="90" class="txt-muted">1</text>
  <text x="32" y="112" class="txt-muted">2</text>
  <text x="32" y="134" class="txt-muted">3</text>
  <text x="32" y="156" class="txt-muted">4</text>
  <text x="32" y="178" class="txt-muted">5</text>
  <text x="32" y="200" class="txt-muted">6</text>
  <text x="32" y="222" class="txt-muted">7</text>
  <text x="32" y="244" class="txt-muted">8</text>

  <!-- Code Canvas -->
  <text x="65" y="90" class="txt-kw">use</text>
  <text x="95" y="90" class="txt-main">std::collections::HashMap;</text>

  <text x="65" y="134" class="txt-kw">pub fn</text>
  <text x="125" y="134" class="txt-fn">calculate_metrics</text>
  <text x="260" y="134" class="txt-main">(data: &amp;[</text>
  <text x="325" y="134" class="txt-type">i64</text>
  <text x="350" y="134" class="txt-main">]) -&gt; </text>
  <text x="395" y="134" class="txt-type">Option&lt;f64&gt;</text>
  <text x="495" y="134" class="txt-main">{</text>

  <text x="85" y="156" class="txt-kw">let</text>
  <text x="115" y="156" class="txt-main">total: </text>
  <text x="165" y="156" class="txt-type">i64</text>
  <text x="195" y="156" class="txt-main">= data.iter().sum();</text>

  <text x="85" y="178" class="txt-kw">let</text>
  <text x="115" y="178" class="txt-main">count = data.len();</text>

  <text x="85" y="210" class="txt-kw">if</text>
  <text x="105" y="210" class="txt-main">count == </text>
  <text x="175" y="210" class="txt-num">0</text>
  <text x="190" y="210" class="txt-main">{ </text>
  <text x="205" y="210" class="txt-type">None</text>
  <text x="245" y="210" class="txt-main"> } </text>
  <text x="260" y="210" class="txt-kw">else</text>
  <text x="295" y="210" class="txt-main">{ </text>
  <text x="310" y="210" class="txt-type">Some</text>
  <text x="345" y="210" class="txt-main">(total </text>
  <text x="390" y="210" class="txt-kw">as</text>
  <text x="410" y="210" class="txt-type">f64</text>
  <text x="440" y="210" class="txt-main">/ count </text>
  <text x="500" y="210" class="txt-kw">as</text>
  <text x="520" y="210" class="txt-type">f64</text>
  <text x="545" y="210" class="txt-main">) }</text>

  <text x="65" y="244" class="txt-main">}</text>

  <!-- Bottom Cargo Panel Dock -->
  <rect x="0" y="300" width="800" height="180" class="panel"/>
  <rect x="0" y="300" width="800" height="30" fill="#21262d"/>
  <text x="15" y="320" font-family="sans-serif" font-size="12" fill="#e6edf3" font-weight="bold">🦀 Cargo Pipeline</text>
  <text x="135" y="320" font-family="sans-serif" font-size="11" fill="#3fb950" font-weight="bold">[Success]</text>
  <text x="200" y="320" font-family="sans-serif" font-size="11" fill="#8b949e">cargo check --workspace</text>

  <rect x="370" y="304" width="100" height="22" rx="3" fill="#161b22"/>
  <text x="382" y="319" font-family="sans-serif" font-size="11" fill="#58a6ff">Terminal (0)</text>

  <rect x="475" y="304" width="150" height="22" rx="3" fill="#21262d"/>
  <text x="487" y="319" font-family="sans-serif" font-size="11" fill="#8b949e">Diagnostics (0 err, 0 warn)</text>

  <!-- Terminal log output -->
  <g transform="translate(15, 345)">
    <text x="0" y="15" font-family="monospace" font-size="11" fill="#7ee787">    Checking</text>
    <text x="80" y="15" font-family="monospace" font-size="11" fill="#e6edf3">karkinos-core v0.2.3 (/home/developer/karkinos)</text>
    <text x="0" y="35" font-family="monospace" font-size="11" fill="#7ee787">    Checking</text>
    <text x="80" y="35" font-family="monospace" font-size="11" fill="#e6edf3">karkinos v0.2.3 (/home/developer/karkinos)</text>
    <text x="0" y="55" font-family="monospace" font-size="11" fill="#3fb950" font-weight="bold">    Finished</text>
    <text x="80" y="55" font-family="monospace" font-size="11" fill="#e6edf3">`dev` profile [unoptimized + debuginfo] target(s) in 0.48s</text>
    <text x="0" y="75" font-family="monospace" font-size="11" fill="#58a6ff">Ready. 0 errors, 0 warnings.</text>
  </g>
</svg>
