<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #21262d; }
      .tab-active { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .txt-main { font-family: monospace; font-size: 13px; fill: #e6edf3; }
      .txt-muted { font-family: monospace; font-size: 12px; fill: #8b949e; }
      .txt-kw { font-family: monospace; font-size: 13px; fill: #ff7b72; font-weight: bold; }
      .txt-fn { font-family: monospace; font-size: 13px; fill: #d2a8ff; }
      .txt-type { font-family: monospace; font-size: 13px; fill: #79c0ff; }
      .inlay-badge { fill: #1f293d; stroke: #388bfd44; stroke-width: 1; rx: 3; }
      .inlay-txt { font-family: monospace; font-size: 11px; fill: #79c0ff; }
      .inlay-param { font-family: monospace; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="800" height="480" rx="8" class="bg" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect width="800" height="38" rx="8" class="bar"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="75" y="23" font-family="sans-serif" font-size="12" fill="#8b949e" font-weight="600">Karkinos IDE — Inlay Hints (Type &amp; Parameter Annotations)</text>

  <!-- Tab bar -->
  <rect x="0" y="38" width="800" height="28" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <rect x="10" y="42" width="120" height="24" rx="3" class="tab-active"/>
  <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#e6edf3">pipeline.rs</text>

  <!-- Gutter -->
  <rect x="0" y="66" width="50" height="414" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="32" y="105" class="txt-muted">1</text>
  <text x="32" y="145" class="txt-muted">2</text>
  <text x="32" y="185" class="txt-muted">3</text>
  <text x="32" y="225" class="txt-muted">4</text>
  <text x="32" y="265" class="txt-muted">5</text>
  <text x="32" y="305" class="txt-muted">6</text>
  <text x="32" y="345" class="txt-muted">7</text>

  <!-- Code with Inlay Hints -->
  <!-- Line 1: fn process -->
  <text x="65" y="105" class="txt-kw">fn</text>
  <text x="88" y="105" class="txt-fn">transform_records</text>
  <text x="235" y="105" class="txt-main">(raw_inputs: Vec&lt;&amp;str&gt;) {</text>

  <!-- Line 2: let numbers = raw_inputs... -->
  <text x="85" y="145" class="txt-kw">let</text>
  <text x="115" y="145" class="txt-main">numbers</text>
  <!-- Inlay Hint: Type badge -->
  <rect x="180" y="132" width="115" height="18" class="inlay-badge"/>
  <text x="185" y="145" class="inlay-txt">: Vec&lt;u32&gt;</text>
  <text x="305" y="145" class="txt-main">= raw_inputs</text>

  <!-- Line 3: .iter() -->
  <text x="125" y="185" class="txt-main">.iter()</text>
  <!-- Inlay Hint: Chained return type -->
  <rect x="180" y="172" width="100" height="18" class="inlay-badge"/>
  <text x="185" y="185" class="inlay-txt">: Iter&lt;&amp;str&gt;</text>

  <!-- Line 4: .filter_map(...) -->
  <text x="125" y="225" class="txt-main">.filter_map(|s| s.parse().ok())</text>
  <!-- Inlay Hint: FilterMap return type -->
  <rect x="375" y="212" width="145" height="18" class="inlay-badge"/>
  <text x="380" y="225" class="inlay-txt">: FilterMap&lt;u32&gt;</text>

  <!-- Line 5: .collect(); -->
  <text x="125" y="265" class="txt-main">.collect();</text>

  <!-- Line 6: invoke function with parameter hints -->
  <text x="85" y="305" class="txt-fn">store_results</text>
  <text x="180" y="305" class="txt-main">(</text>
  <!-- Parameter inlay hint -->
  <rect x="190" y="292" width="55" height="18" class="inlay-badge"/>
  <text x="195" y="305" class="inlay-param">dataset:</text>
  <text x="250" y="305" class="txt-main">&amp;numbers, </text>
  <rect x="330" y="292" width="50" height="18" class="inlay-badge"/>
  <text x="335" y="305" class="inlay-param">sync:</text>
  <text x="385" y="305" class="txt-kw">true</text>
  <text x="415" y="305" class="txt-main">);</text>

  <text x="65" y="345" class="txt-main">}</text>

  <!-- Info Callout Banner at bottom -->
  <g transform="translate(65, 380)">
    <rect width="670" height="65" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="25" cy="32" r="10" fill="#388bfd22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="21" y="36" font-family="sans-serif" font-size="12" fill="#58a6ff" font-weight="bold">i</text>
    <text x="48" y="26" font-family="sans-serif" font-size="12" fill="#e6edf3" font-weight="bold">Zero Guesswork Type Inference</text>
    <text x="48" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Inlay hints reveal compiler-inferred types across complex iterator chains and parameter names without cluttering source text.</text>
  </g>
</svg>
