[package]
name = "rope_editor_gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rope_editor_gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
image = { version = "0.24", default-features = false, features = ["png"] }

# Binario más liviano y rápido sin cambiar el código: LTO entre crates,
# una sola unidad de codegen y símbolos de debug fuera.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true