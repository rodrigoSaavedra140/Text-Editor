[package]
name = "rope_editor_gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rope_editor_gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
image = { version = "0.24", default-features = false, features = ["png"] }